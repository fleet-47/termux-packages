name: Android AArch64 toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare package builder
        run: ./scripts/run-docker.sh true
      - name: Free build disk space
        run: ./scripts/free-space.sh
      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
      - name: Build LLVM, Clang, LLD and Rust
        run: |
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 android-toolchain-llvm rustc-nightly
      - name: Record build inputs
        if: always()
        run: |
          mkdir -p output
          cp android-toolchain.json output/
          docker container inspect termux-package-builder --format '{{.Image}}' > output/builder-image.txt
      - name: Upload packages and upstream test inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-aarch64-toolchain
          path: output/
          compression-level: 0

  upstream-tests:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-aarch64-toolchain
          path: output
      - name: Extract upstream test inputs
        run: |
          mkdir -p runtime-root
          tar --zstd -xf output/android-toolchain-build-support/llvm-tests.tar.zst -C runtime-root
          mkdir -p runtime-root/rust-source
          tar -xJf output/android-toolchain-build-support/rust-source.tar.xz -C runtime-root/rust-source
          sudo chown -R 1000:1000 runtime-root
      - name: Run upstream suites in AArch64 Termux
        run: |
          docker pull termux/termux-docker:aarch64
          docker image inspect termux/termux-docker:aarch64 --format '{{index .RepoDigests 0}}' > runtime-image.txt
          docker run --rm --platform linux/arm64 \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/runtime-root/home/builder:/home/builder" \
            --volume "$PWD/runtime-root/rust-source:/rust-source" \
            --workdir /workspace termux/termux-docker:aarch64 \
            bash -euc '
              pkg update -y
              pkg install -y python cmake ninja make pkg-config git perl jq zstd xz-utils \
                clang lld llvm libcompiler-rt libc++ libandroid-execinfo openssl zlib \
                gdb nodejs diffutils findutils coreutils
              apt install -y ./output/android-toolchain-llvm_*_aarch64.deb \
                ./output/rustc-nightly_*_aarch64.deb \
                ./output/rust-nightly-std-aarch64-linux-android_*_aarch64.deb \
                ./output/rust-src-nightly_*_all.deb
              status=0
              bash packages/android-toolchain-llvm/run-upstream-tests.sh \
                /workspace/output/android-toolchain-build-support/llvm-test-paths || status=1
              bash packages/rustc-nightly/run-upstream-tests.sh \
                /rust-source /workspace/android-toolchain.json || status=1
              exit "$status"
            ' 2>&1 | tee upstream-tests.log
      - name: Upload upstream test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-aarch64-upstream-tests
          path: |
            upstream-tests.log
            runtime-image.txt
