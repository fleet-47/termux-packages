name: Android AArch64 toolchain

on:
  push:
    branches:
    - termux-toolchain
    paths:
    - 'packages/**'
    - 'root-packages/**'
    - 'x11-packages/**'
  pull_request:
    paths:
    - 'packages/**'
    - 'root-packages/**'
    - 'x11-packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "A space-separated names of packages selected for rebuilding"
        required: true
        default: android-toolchain-llvm rustc-nightly
      free-space:
        description: "Free space even if not building large package (useful when building a large number of packages)"
        type: boolean
        default: true

permissions: {} # none

concurrency:
  # if this is a PR event, group = "pr-<number>", otherwise group = run_id so it never collides with other runs
  group: ${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), github.run_id) }}
  # only cancel in-progress when it’s a PR
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read # actions/upload-artifact doesn't need contents: write
      actions: read
    runs-on: ubuntu-26.04
    env:
      TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env TERMUX_PKG_MAKE_PROCESSES=2
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1000

    - name: Prepare toolchain profile
      run: |
        cp scripts/android-toolchain.json android-toolchain.json
        mkdir -p output
        cp android-toolchain.json output/android-toolchain.json

    - name: Gather build summary
      id: build-info
      env:
        MANUAL_INPUT_PACKAGES: ${{ github.event.inputs.packages }}
      run: |
        # We are intentionally not using .commits[0].id and .commits[-1].id as github seems to
        # only send 20 commits in the payload for github action runs instead of the 2048 documented
        # limit. Perhaps 2048 is the limit just for webhooks, where they haven't documented
        # properly that the limit for github actions is only 20:
        #
        # https://docs.github.com/en/webhooks/webhook-events-and-payloads#push
        OLD_COMMIT="${{ github.event.before }}"
        HEAD_COMMIT="${{ github.event.after }}"
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "${BASE_REF:-master}" 2>/dev/null
          BASE_COMMIT="$(git merge-base "origin/${BASE_REF:-master}" "HEAD")"
          if [ -z "${{ github.event.pull_request.base.sha }}" ]; then
            if ! git log "$OLD_COMMIT" > /dev/null; then
              if [ "$(git branch --show-current)" = "master" ]; then
                echo "Force push detected on master branch. Unable to proceed."
                exit 1
              else
                OLD_COMMIT=$(git fetch origin master >&2; git merge-base origin/master $HEAD_COMMIT)
              fi
            fi
            echo "Processing commit range: ${OLD_COMMIT}..${HEAD_COMMIT}"
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${OLD_COMMIT}" "${HEAD_COMMIT}")
          else
            # Pull requests.
            echo "Processing pull request #${{ github.event.pull_request.number }}: ${BASE_COMMIT}..HEAD"
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${BASE_COMMIT}" "HEAD")
          fi
        fi
        mkdir -p ./artifacts ./debs
        touch ./debs/.placeholder

        if [[ "${{ github.event_name }}" == "pull_request" && -n "$(git rev-list --merges "$(git fetch origin master >&2; git merge-base origin/master $HEAD_COMMIT)..$HEAD_COMMIT")" ]]; then
          # Github does not allow multiline errors, but it will interpret the escape sequence %0A as a line break.
          echo "::error ::Merge commits are not allowed in pull requests.%0AYou should rebase your commits or squash them.%0Ahttps://docs.github.com/en/get-started/using-git/using-git-rebase-on-the-command-line"
          exit 1
        fi

        OLD_COMMIT="$OLD_COMMIT" HEAD_COMMIT="$HEAD_COMMIT" GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" scripts/utils/termux_reuse_pr_build_artifacts.sh "${{ github.event_name }}" "aarch64" || true

        # A subpackage goes to the repository named by TERMUX_SUBPKG_REPO
        # (main, x11 or root), or to the repository of its parent package.
        subpkg_repo_name() {
          local target
          target="$(sed -nE "s/^TERMUX_SUBPKG_REPO=[\"']?([^\"']*)[\"']?\$/\\1/p" "$1")"
          case "$target" in
            main|x11|root) echo "termux-$target" ;;
            *) echo "$2" ;;
          esac
        }

        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          # GitHub sometimes add merge commits at the end
          # To prevent user confusion, filter them with --no-merges
          # Process tag '%ci:no-build' that may be added as line to commit message.
          # Forces CI to cancel current build with status 'passed'
          if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 --no-merges "HEAD"); then
            tar cf artifacts/debs-aarch64.tar debs
            echo "[!] Force exiting as tag '%ci:no-build' was applied to HEAD commit message."
            exit 0
          fi

          for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
            repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
            # Parse changed files and identify new packages and deleted packages.
            # Create lists of those packages that will be passed to upload job for
            # further processing.
            while read -r file; do
              if ! [[ $file == ${repo_path}/* ]]; then
                # This file does not belong to a package, so ignore it
                continue
              fi
              if [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/([.a-z0-9+-]*).subpackage.sh$ ]]; then
                # A subpackage was modified, check if it was deleted or just updated
                pkg=${BASH_REMATCH[1]}
                subpkg=${BASH_REMATCH[2]}
                if [ ! -f "${repo_path}/${pkg}/${subpkg}.subpackage.sh" ]; then
                  echo "$subpkg" >> ./deleted_${repo}_packages.txt
                fi
              elif [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/.*$ ]]; then
                # package, check if it was deleted or updated
                pkg=${BASH_REMATCH[1]}
                if [ -d "${repo_path}/${pkg}" ]; then
                  echo "$pkg" >> ./built_${repo}_packages.txt
                  # If there are subpackages we want to create a list of those
                  # as well
                  for file in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                    echo "$(basename "${file%%.subpackage.sh}")" >> ./built_$(subpkg_repo_name "$file" "$repo")_subpackages.txt
                  done
                else
                  echo "$pkg" >> ./deleted_${repo}_packages
                fi
              fi
            done<<<${CHANGED_FILES}
          done
        else
          # Ensure MANUAL_INPUT_PACKAGES is newline free, and put it
          # into an array
          read -a PACKAGES <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          for pkg in "${PACKAGES[@]}"; do
            repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)
            found=false
            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                found=true
                echo "$pkg" >> ./built_${repo}_packages.txt
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> ./built_$(subpkg_repo_name "$subpkg" "$repo")_subpackages.txt
                done
              fi
            done
            if [ "$found" != true ]; then
              echo "Package '${pkg}' not found in any of the repo"
              exit 1
            fi
          done
        fi

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          # Fix so that lists do not contain duplicates
          if [ -f ./built_${repo}_packages.txt ]; then
            sort ./built_${repo}_packages.txt | uniq > ./built_${repo}_packages.txt.tmp
            mv ./built_${repo}_packages.txt.tmp ./built_${repo}_packages.txt
          fi
          if [ -f ./built_${repo}_subpackages.txt ]; then
            sort ./built_${repo}_subpackages.txt | uniq > ./built_${repo}_subpackages.txt.tmp
            mv ./built_${repo}_subpackages.txt.tmp ./built_${repo}_subpackages.txt
          fi
          if [ -f ./deleted_${repo}_packages.txt ]; then
            sort ./deleted_${repo}_packages.txt | uniq > ./deleted_${repo}_packages.txt.tmp
            mv ./deleted_${repo}_packages.txt.tmp ./deleted_${repo}_packages.txt
          fi
        done

        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done

        echo "packages: ${packages[*]}"

        skip_building=false
        if grep -qx 'skip-building=true' "$GITHUB_OUTPUT"; then
          skip_building=true
        elif [[ "${#packages[@]}" -gt 0 ]]; then
          set +e
          DRY_RUN_OUTPUT=$(./scripts/bin/build-package-dry-run-simulation.sh -I -C -a "aarch64" "${packages[@]}" 2>&1)
          DRY_RUN_RC=$?
          set -e
          echo "$DRY_RUN_OUTPUT"
          if [ "$DRY_RUN_RC" -eq 85 ]; then
            skip_building=true
          fi
        fi
        echo "skip-building=$skip_building" >> $GITHUB_OUTPUT

        free_space='false'
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          free_space=${{ github.event.inputs.free-space }}
        else
          if grep -qiP '^\s*%ci:free-disk\s*$' <(git log --format="%B" -n 1 --no-merges "HEAD"); then
            free_space=true
          fi
        fi
        if [[ "${#packages[@]}" -gt 0 ]]; then
          for pkg in "${packages[@]}"; do
            if grep -qFx "$pkg" ./scripts/big-pkgs.list; then
              free_space='true'
              break
            fi
          done
        fi
        echo "free-space=$free_space" >> $GITHUB_OUTPUT

        needs_docker_build=false
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          # Build local Docker image if setup scripts were changed.
          # Useful for pull requests submitting changes for both build environment and packages.
          if grep -qP '^scripts/(Dockerfile|properties\.sh|setup-android-sdk\.sh|setup-ubuntu\.sh)$' <<< "$CHANGED_FILES"; then
            needs_docker_build=true
          fi
        fi
        echo "needs-docker-build=$needs_docker_build" >> $GITHUB_OUTPUT

    - name: Fetch reused upstream test inputs
      if: ${{ steps.build-info.outputs.reused-run-id != '' }}
      uses: actions/download-artifact@v8
      with:
        name: android-aarch64-toolchain
        path: output
        repository: fleet-47/termux-packages
        run-id: ${{ steps.build-info.outputs.reused-run-id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint packages
      run: |
        declare -a package_recipes=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            package_recipes+=($(cat "./built_${repo}_packages.txt" | repo_path="${repo_path}" awk '{print ENVIRON["repo_path"]"/"$1"/build.sh"}'))
          fi
        done

        if [[ "${#package_recipes[@]}" -gt 0 ]]; then
          ./scripts/lint-packages.sh "${package_recipes[@]}"
        fi

    - name: Enable zram
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Build docker image
      if: ${{ steps.build-info.outputs.needs-docker-build == 'true' }}
      run: |
        docker build -t ghcr.io/termux/package-builder:latest scripts/
        docker buildx prune -af

    - name: Load Docker image
      if: ${{ steps.build-info.outputs.free-space == 'true' && steps.build-info.outputs.skip-building != 'true' }}
      run: |
        ./scripts/run-docker.sh true

    - name: Free additional disk space (if needed)
      if: ${{ steps.build-info.outputs.free-space == 'true' && steps.build-info.outputs.skip-building != 'true' }}
      run: |
        ./scripts/free-space.sh

    - name: List packages that are still installed on the server
      if: ${{ steps.build-info.outputs.free-space == 'true' && steps.build-info.outputs.skip-building != 'true' && runner.debug }}
      run: |
        dpkg-query -W -f='${Installed-size} ${Package}\n' | sort -n

    - name: List directory size for debug
      if: ${{ steps.build-info.outputs.free-space == 'true' && steps.build-info.outputs.skip-building != 'true' && runner.debug }}
      run: |
        size() {
          echo "Directory size info for '$1':"
          du --bytes "$1" --max-depth 1 | sort -n
          echo
          echo
          echo
        }
        size /
        size /usr
        size /var
        size /var/lib
        size /var/

    - name: Build packages
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      run: |
        set -o pipefail
        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done

        echo "packages: ${packages[*]}"

        if [[ "${#packages[@]}" -gt 0 ]]; then
          ./scripts/run-docker.sh -d ./build-package.sh -I -C -a "aarch64" "${packages[@]}" 2>&1 \
            | tee output/android-toolchain-build.log
        fi

    - name: Collect build diagnostics
      if: always()
      shell: bash
      run: |
        mkdir -p output/android-toolchain-diagnostics
        if docker container inspect termux-package-builder > /dev/null 2>&1; then
          docker exec termux-package-builder bash -euo pipefail -c '
            cd /home/builder/.termux-build
            roots=()
            for package in android-toolchain-llvm rustc-nightly; do
              if [[ -d "$package" ]]; then roots+=("$package"); fi
            done
            if [[ "${#roots[@]}" -gt 0 ]]; then
              find "${roots[@]}" -type d \( -name src -o -name .git \) -prune -o \
                -type f \( -name CMakeCache.txt -o -name CMakeConfigureLog.yaml \
                -o -name CMakeError.log -o -name CMakeOutput.log \) -print0 \
                | tar --null -czf - --files-from=-
            else
              tar -czf - --files-from=/dev/null
            fi
          ' > output/android-toolchain-diagnostics/cmake-diagnostics.tar.gz
        else
          echo "Builder container was not created." > output/android-toolchain-diagnostics/container.txt
        fi

    - name: Store build diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-aarch64-build-diagnostics
        path: |
          output/android-toolchain-build.log
          output/android-toolchain-diagnostics/

    - name: Generate build artifacts
      if: always()
      run: |
        test -d termux-packages/output && mv termux-packages/output/* ./output/

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          # Put package lists into directory with *.deb files so they will be transferred to
          # upload job.
          test -f ./built_${repo}_packages.txt && mv ./built_${repo}_packages.txt ./debs/
          test -f ./built_${repo}_subpackages.txt && cat ./built_${repo}_subpackages.txt >> ./debs/built_${repo}_packages.txt \
            && rm ./built_${repo}_subpackages.txt
          test -f ./deleted_${repo}_packages.txt && mv ./deleted_${repo}_packages.txt ./debs/

          # Move only debs from built_packages into debs/ folder before
          # creating an archive.
          if [ -f "./debs/built_${repo}_packages.txt" ] && [ -d "output" ]; then
            while read -r pkg; do
              # Match both $pkg.deb and $pkg-static.deb.
              find output \( -name "${pkg}_*.deb" -o -name "${pkg}-static_*.deb" \) -type f -print0 | xargs -0r mv -t debs/
            done < <(cat "./debs/built_${repo}_packages.txt")
          fi
        done

        # Rust-only builds must test the freshly built LLVM dependency too.
        if compgen -G 'debs/rustc-nightly_*_aarch64.deb' > /dev/null &&
           ! compgen -G 'debs/android-toolchain-llvm_*_aarch64.deb' > /dev/null; then
          shopt -s nullglob
          llvm_dependencies=(output/android-toolchain-llvm_*_aarch64.deb)
          [[ "${#llvm_dependencies[@]}" -eq 1 ]]
          mv "${llvm_dependencies[0]}" debs/
          shopt -u nullglob
        fi

        # Files containing certain symbols (e.g. ":") will cause failure in actions/upload-artifact.
        # Archiving *.deb files in a tarball to avoid issues with uploading.
        tar cf artifacts/debs-aarch64-${{ github.sha }}.tar debs
    - name: Checksums for built *.deb files
      if: always()
      run: |
        find debs -type f -name "*.deb" -exec sha256sum "{}" \; | sort -k2 | tee checksum-aarch64-${{ github.sha }}.txt
    - name: Store checksums for built *.deb files
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: checksum-aarch64-${{ github.sha }}
        path: checksum-aarch64-${{ github.sha }}.txt
    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: debs-aarch64-${{ github.sha }}
        path: ./artifacts
    - name: AppArmor Logs
      if: always()
      run: |
        sudo dmesg | grep apparmor

    - name: Store upstream test inputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-aarch64-toolchain
        path: |
          output/android-toolchain-build-support/
          output/android-toolchain.json
        compression-level: 0

  test-buildorder-random:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Randomise buildorder.py test
      run: ./scripts/bin/test-buildorder-random
    - name: Randomise buildorder.py test (aarch64)
      env:
        TERMUX_ARCH: aarch64
      run: ./scripts/bin/test-buildorder-random

  upload-test:
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-slim
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Get *.deb files
      uses: actions/download-artifact@v8
      with:
        path: ./
    - name: Check packages using Packages.bz2
      run: |
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          # GitHub sometimes add merge commits at the end
          # To prevent user confusion, filter them with --no-merges
          # Process tag '%ci:no-build' that may be added as line to commit message.
          # Forces CI to cancel current build with status 'passed'
          if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 --no-merges "HEAD"); then
            echo "[!] Force exiting as tag '%ci:no-build' was applied to HEAD commit message."
            exit 0
          fi
        fi

        for archive in debs-*/debs-aarch64-${{ github.sha }}.tar; do
          tar xf "$archive"
        done

        ./scripts/utils/termux_check_file_conflicts.sh debs

  upload:
    concurrency:
      group: ${{ github.workflow }}-upload
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    if: github.repository == 'termux/termux-packages' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-slim
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Get *.deb files
      uses: actions/download-artifact@v8
      with:
        path: ./
    - name: Upload to packages.termux.dev
      env:
        REPOSITORY_URL: https://packages.termux.dev/aptly-api
        GITHUB_SHA: ${{ github.sha }}
        APTLY_API_AUTH: ${{ secrets.APTLY_API_AUTH }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        source scripts/aptly_api.sh

        for archive in debs-*/debs-aarch64-${{ github.sha }}.tar; do
          tar xf "$archive"
        done

        for repo in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          export REPOSITORY_NAME=$(jq --raw-output '.["'$repo'"].name' repo.json)
          export REPOSITORY_DISTRIBUTION=$(jq --raw-output '.["'$repo'"].distribution' repo.json)

          # Upload file to temporary directory.
          uploaded_files=false
          shopt -s nullglob

          if [ -f debs/built_${REPOSITORY_NAME}_packages.txt ]; then
            for filename in $(cat debs/built_${REPOSITORY_NAME}_packages.txt | sed -E 's/(..*)/debs\/\1_\*.deb debs\/\1-static_\*.deb/g'); do
              if ! aptly_upload_file "$filename"; then
                exit 1
              fi

              uploaded_files=true
            done
            shopt -u nullglob

            # Publishing repository changes.
            if [ "$uploaded_files" = "true" ]; then
              if ! aptly_add_to_repo; then
                exit 1
              fi

              # Usually temporary directory is deleted automatically, but in certain cases it is left.
              aptly_delete_dir

              # Final part to make changes appear in web root.
              if ! aptly_publish_repo; then
                exit 1
              fi

              # Publish to staging repo if we haven't already
              if [[ "$REPOSITORY_DISTRIBUTION" != "staging" ]]; then
                REPOSITORY_DISTRIBUTION=staging
                if ! aptly_publish_repo; then
                  exit 1
                fi
              fi
            fi
          fi
        done

  upstream-tests:
    permissions:
      contents: read
    needs: [build, upload-test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-aarch64-toolchain
          path: output
      - uses: actions/download-artifact@v8
        with:
          name: debs-aarch64-${{ github.sha }}
          path: package-artifacts
      - name: Extract upstream test inputs
        id: test-inputs
        shell: bash
        run: |
          tar -xf package-artifacts/debs-aarch64-${{ github.sha }}.tar --strip-components=1 -C output
          llvm=false
          rust=false
          llvm_selected=false
          for package_list in output/built_*_packages.txt; do
            if [[ -f "$package_list" ]] && grep -qx android-toolchain-llvm "$package_list"; then
              llvm_selected=true
            fi
          done
          if compgen -G 'output/android-toolchain-llvm_*_aarch64.deb' > /dev/null; then
            (cd output/android-toolchain-build-support && sha256sum -c llvm-support.sha256)
          fi
          if [[ "$llvm_selected" == true ]]; then
            compgen -G 'output/android-toolchain-llvm_*_aarch64.deb' > /dev/null
            llvm=true
            mkdir -p runtime-root
            tar --zstd -xf output/android-toolchain-build-support/llvm-tests.tar.zst -C runtime-root
            test -s output/android-toolchain-build-support/llvm-test-paths
          fi
          if compgen -G 'output/rustc-nightly_*_aarch64.deb' > /dev/null; then
            rust=true
            (cd output/android-toolchain-build-support && sha256sum -c rust-support.sha256)
            mkdir -p runtime-root/rust-source runtime-root/rust-test-work
            tar -xJf output/android-toolchain-build-support/rust-source.tar.xz -C runtime-root/rust-source
          fi
          echo "llvm=$llvm" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if [[ "$llvm" == true || "$rust" == true ]]; then
            mkdir -p runtime-root/home/builder runtime-root/rust-source runtime-root/rust-test-work runtime-root/runtime-gate
            sudo chown -R 1000:1000 runtime-root
          fi
      - name: Run upstream suites in AArch64 Termux
        if: steps.test-inputs.outputs.llvm == 'true' || steps.test-inputs.outputs.rust == 'true'
        env:
          TEST_LLVM: ${{ steps.test-inputs.outputs.llvm }}
          TEST_RUST: ${{ steps.test-inputs.outputs.rust }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull termux/termux-docker:aarch64
          docker image inspect termux/termux-docker:aarch64 --format '{{index .RepoDigests 0}}' > runtime-image.txt
          docker run --rm --platform linux/arm64 \
            --env TEST_LLVM --env TEST_RUST --env TOOLCHAIN_RUNTIME_LOG_DIR=/runtime-gate \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/runtime-root/home/builder:/home/builder" \
            --volume "$PWD/runtime-root/rust-source:/rust-source" \
            --volume "$PWD/runtime-root/rust-test-work:/data/local/tmp/work" \
            --volume "$PWD/runtime-root/runtime-gate:/runtime-gate" \
            --workdir /workspace termux/termux-docker:aarch64 \
            bash -euo pipefail -c '
              pkg update -y
              pkg install -y python cmake ninja make pkg-config git perl jq zstd xz-utils \
                ndk-sysroot ndk-multilib libcompiler-rt libc++ libandroid-execinfo openssl zlib \
                gdb nodejs diffutils findutils coreutils file binutils
              mapfile -t llvm_packages < <(compgen -G "./output/android-toolchain-llvm_*_aarch64.deb")
              [[ "${#llvm_packages[@]}" -eq 1 ]]
              apt install -y "${llvm_packages[@]}"
              if [[ "$TEST_RUST" == true ]]; then
                apt install -y ./output/rustc-nightly_*_aarch64.deb \
                  ./output/rust-nightly-std-aarch64-linux-android_*_aarch64.deb \
                  ./output/rust-src-nightly_*_all.deb
              fi
              metadata="$PREFIX/opt/android-toolchain-llvm/share/android-toolchain-runtime"
              support=/workspace/output/android-toolchain-build-support
              for name in llvm-resources.sha256 llvm-link-runtimes.sha256; do
                test -s "$metadata/$name"
                if [[ -f "$support/$name" ]]; then cmp "$support/$name" "$metadata/$name"; fi
                (cd "$PREFIX" && sha256sum -c "$metadata/$name")
              done
              if [[ "$TEST_RUST" == true ]]; then
                test -s "$support/rust-link-runtimes.sha256"
                (cd "$PREFIX" && sha256sum -c "$support/rust-link-runtimes.sha256")
              fi
              binaries=("$PREFIX/opt/android-toolchain-llvm/bin/clang"
                        "$PREFIX/opt/android-toolchain-llvm/bin/ld.lld")
              library_dirs=("$PREFIX/opt/android-toolchain-llvm/lib")
              if [[ -f "$support/llvm-build-info.txt" ]]; then cat "$support/llvm-build-info.txt"; fi
              if [[ "$TEST_RUST" == true ]]; then
                binaries+=("$PREFIX/opt/rust-nightly/bin/rustc"
                           "$PREFIX/opt/rust-nightly/bin/cargo"
                           "$PREFIX/opt/rust-nightly/bin/rustdoc")
                library_dirs+=("$PREFIX/opt/rust-nightly/lib")
                cat output/android-toolchain-build-support/rust-build-info.txt
              fi
              for library_dir in "${library_dirs[@]}"; do
                find "$library_dir" -type f \( -name "*.so" -o -name "*.so.*" \) -print0 > "$TMPDIR/toolchain-shared-libraries"
                while IFS= read -r -d "" library; do
                  binaries+=("$library")
                done < "$TMPDIR/toolchain-shared-libraries"
              done
              for binary in "${binaries[@]}"; do
                file "$binary"
                readelf -W -h -l -d "$binary"
              done
              bash packages/android-toolchain-llvm/run-upstream-tests.sh \
                --runtime-only /workspace/output/android-toolchain.json
              status=0
              if [[ "$TEST_LLVM" == true ]]; then
                bash packages/android-toolchain-llvm/run-upstream-tests.sh \
                  /workspace/output/android-toolchain-build-support/llvm-test-paths || status=1
              fi
              if [[ "$TEST_RUST" == true ]]; then
                bash packages/rustc-nightly/run-upstream-tests.sh \
                  /rust-source /workspace/output/android-toolchain.json 2 || status=1
              fi
              exit "$status"
            ' 2>&1 | tee upstream-tests.log
      - name: Upload upstream test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-aarch64-upstream-tests
          path: |
            upstream-tests.log
            runtime-image.txt
            runtime-root/runtime-gate/*.log
            runtime-root/runtime-gate/*.txt
            runtime-root/runtime-gate/*.profraw
            runtime-root/runtime-gate/*.profdata
