# See documentation at
# https://github.com/rust-lang/rust/blob/master/bootstrap.example.toml

change-id = "ignore"

[llvm]
assertions = true
download-ci-llvm = false
link-shared = true

[build]
host = ["@CARGO_TARGET_NAME@"]
target = ["aarch64-linux-android"]
rustc = "@RUSTC@"
cargo = "@CARGO@"
python = "python3"
extended = true
docs = false
tools = [
    "cargo",
    "clippy",
    "rustdoc",
    "rustfmt",
    "rust-analyzer-proc-macro-srv",
    "analysis",
    "src",
]
sanitizers = false
local-rebuild = true
android-ndk = "@TERMUX_STANDALONE_TOOLCHAIN@"

[install]
prefix = "@RUST_PREFIX@"
sysconfdir = "etc"
docdir = "share/doc/rust"

[rust]
optimize = true
debug = false
codegen-units = 0
jemalloc = false
channel = "nightly"
rpath = false
lld = false
codegen-backends = ["llvm"]

[target.x86_64-unknown-linux-gnu]
llvm-config = "/usr/bin/llvm-config-21"
rpath = true

[target.aarch64-linux-android]
cc = "@CC@"
cxx = "@CXX@"
ar = "@AR@"
linker = "@CC@"
rustflags = @TARGET_RUSTFLAGS@
llvm-config = "@TERMUX_PREFIX@/opt/android-toolchain-llvm/bin/llvm-config-build-host"
profiler = true

[dist]
src-tarball = false
compression-formats = ["gz"]
